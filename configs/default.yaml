# Default training configuration
# Usage: python -m src.train --config configs/default.yaml

# Model architecture
vocab_size: 8192
d_model: 256
n_heads: 4
d_ff: 512
n_layers: 4
max_seq_len: 128
dropout: 0.1

# Training
epochs: 5
batch_size: 64
learning_rate: 3.0e-4
weight_decay: 0.01
warmup_steps: 200
max_grad_norm: 1.0
seed: 42

# Data loading
num_workers: 0
pin_memory: false

# Mixed precision
use_amp: false

# Checkpointing
checkpoint_dir: checkpoints
save_every_n_epochs: 1
keep_last_n: 3

# Logging
log_interval: 50
eval_interval: 200
log_dir: logs

# Device
device: auto
